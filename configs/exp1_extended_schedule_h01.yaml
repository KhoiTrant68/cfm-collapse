# Optimization-gap diagnostic (Limitations, "not explained not explored"):
# same extended cosine-schedule run as exp1_extended_schedule.yaml (h=0), but
# at y_noise_h=0.1. If the optimality gap L(v_theta) - L(v*_h) shrinks with
# budget here too (as it does at h=0 in Table 1/Figure 3a), that is evidence
# the plateau is optimization-paced in general, not specific to the h=0
# singularity -- i.e. evidence AGAINST a representation-only explanation,
# without requiring a new convergence-rate theorem.
run_name: exp1_ext_sched_h01_default
seed: 0
device: auto

data:
  d: 2
  k: 1
  N: 200
  sigma_obs: 0.1
  prior_std: 1.0
  source_std: 1.0
  A_kind: random

model:
  conditional: true
  width: 128
  depth: 4
  time_embed_dim: 64
  activation: silu

train:
  max_iters: 1000000
  batch_size: 256
  lr: 0.001
  lr_schedule: cosine
  lr_min: 0.000001
  interpolant_sigma: 0.0
  y_noise_h: 0.1
  checkpoints: [100, 1000, 10000, 30000, 100000, 200000, 400000, 700000, 1000000]

eval:
  n_eval_train: 20
  n_heldout: 8
  M: 1000
  n_steps: 100
  ode_method: rk4
  ode_eps: 0.001
  vel_points: 2000
