# EXP-3, CIFAR-10 DDPM U-Net, with the weights kept along the way.
#
# Why: on the linear-Gaussian problem a trained flow follows the exact kernel
# reference at one effective bandwidth h_eff that falls towards the training
# bandwidth h as training proceeds (results/exp1/_heff). The published CIFAR-10 runs
# kept only their final weights, so there h_eff is known at 60000 iterations alone
# (4.80, 5.75, 7.05 at h = 4, 5, 6). This config re-runs the published setup and
# archives the weights at seven points, so scripts/heff_cifar_checkpoints.py can
# measure h_eff over training at image scale.
#
# Everything is exp3_cifar_ddpm.yaml unchanged: same N, mask, architecture,
# learning rate, batch and budget. The bandwidth, the seed (which redraws the
# training subset and mask as well as the training randomness) and the run name
# are set per run by scripts/kaggle_heff.sh:
#     --set run_name=exp3_cifar_heff_h4_s0 seed=0 train.y_noise_h=4.0
#
# Cost: seven archived checkpoints at ~430 MB each (a resumable checkpoint carries
# Adam's moments) is ~3 GB per run, well inside a Kaggle notebook's output.
run_name: exp3_cifar_heff
seed: 0
device: auto

data:
  N: 2000
  dataset: cifar10
  mask_kind: bottom_half
  source_std: 1.0
  data_root: data

model:
  arch: ddpm
  base: 128
  ch_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16]
  temb_dim: 512
  dropout: 0.0

train:
  max_iters: 60000
  batch_size: 128
  lr: 0.0002
  y_noise_h: 4.0
  amp: true
  checkpoints: [500, 2000, 5000, 10000, 20000, 30000, 40000, 60000]
  save_checkpoints: [2000, 5000, 10000, 20000, 30000, 40000, 60000]

eval:
  # Training-time evaluation is for watching the run only (M=16 carries a ~36%
  # sampling error on a covariance trace). Reported numbers come from
  # heff_cifar_checkpoints.py at M=128 on the archived weights.
  n_conditions: 8
  M: 16
  n_steps: 50
  ode_eps: 0.001
  grid_conditions: 4
  grid_M: 6
