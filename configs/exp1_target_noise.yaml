# EXP-1 remedy: endpoint (target) smoothing X_1 = x^i + rho*xi, optionally
# combined with label smoothing y~ = y^i + h*eps.
#
# Motivation. Proposition "atomicity" rules out *any* remedy whose population
# endpoint law is supported on the training atoms -- which covers label
# smoothing (Thm endpoint) and, trivially, interpolant noise (Prop prop17,
# endpoint-preserving because gamma(1)=0). Smoothing the endpoint itself is the
# one injection of the three that moves the support: the population endpoint
# becomes sum_i p_i^(h)(y) N(x^i, rho^2 I), absolutely continuous, so the
# h-independent Wasserstein floor no longer applies.
#
# Everything else is identical to configs/exp1_linear_gaussian.yaml so the runs
# are directly comparable to the EXP-1 baseline and the p7y_h* sweep.
run_name: exp1_tgt
seed: 0
device: auto

data:
  d: 2
  k: 1
  N: 200
  sigma_obs: 0.1
  prior_std: 1.0
  source_std: 1.0
  A_kind: random

model:
  conditional: true
  width: 128
  depth: 4
  time_embed_dim: 64
  activation: silu

train:
  max_iters: 200000
  batch_size: 256
  lr: 0.001
  interpolant_sigma: 0.0
  y_noise_h: 0.1            # overridden per run
  target_noise_rho: 0.2     # overridden per run; 0 reproduces the atomic case
  checkpoints: [100, 300, 1000, 3000, 10000, 30000, 100000, 200000]

eval:
  n_eval_train: 20
  n_heldout: 8
  M: 1000
  n_steps: 100
  ode_method: rk4
  ode_eps: 0.001
  vel_points: 2000
