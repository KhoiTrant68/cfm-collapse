# EXP-3 in the regime deployed models actually occupy: class conditioning.
#
# Every image run so far conditions on the visible half of an image, which makes
# the labels distinct and puts us in the regime where the theory predicts collapse
# onto a single atom. Class-conditional models are the common case, and there the
# labels repeat by the hundred: with N=2000 over CIFAR-10's ten classes, each label
# is shared by roughly 200 training images.
#
# The prediction changes shape entirely. The population endpoint is no longer a
# point mass but the class empirical measure, (1/|I_y|) sum_{i in I_y} delta_{x^i},
# so the conditional variance converges to the *within-class scatter* -- a large,
# specific number computable from the training set -- rather than to zero. A model
# that hits it looks perfectly healthy by any diversity metric while emitting
# nothing but training images, which is this paper's thesis in the setting that
# matters most.
#
# One-hot conditioning also makes the near-duplicate bounds exact: within a class
# the label distance is 0 and between classes it is sqrt(2), so eps = 0 and
# Delta = sqrt(2), and n_eff should approach the class size rather than 1.
#
# Bandwidth: with that geometry the kernel gives weight 1 within the class and
# exp(-1/h^2) outside it, so h << 1/sqrt(2 ln N) keeps the classes separate and
# h >> 1 merges them. The sweep brackets that: h=0 (hard), h=0.4 (classes still
# separate), h=1.0 (classes starting to merge).
#
# Budget matches exp3_cifar_ddpm.yaml exactly, so collapse depth is comparable.
run_name: exp3_cifar_class
seed: 0
device: auto

data:
  N: 2000
  dataset: cifar10
  cond_kind: class        # y = one-hot class, not the visible half
  mask_kind: bottom_half  # unused when cond_kind=class; kept so configs stay uniform
  source_std: 1.0
  data_root: data

model:
  arch: ddpm
  base: 128
  ch_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16]
  temb_dim: 512
  dropout: 0.0

train:
  max_iters: 60000
  batch_size: 128
  lr: 0.0002
  y_noise_h: 0.0          # swept over {0, 0.4, 1.0}
  amp: true
  checkpoints: [500, 2000, 8000, 20000, 40000, 60000]
  save_checkpoints: [60000]

eval:
  n_conditions: 10        # one per class; there are only ten distinct labels
  M: 16
  n_steps: 50
  ode_eps: 0.001
  grid_conditions: 4
  grid_M: 6
