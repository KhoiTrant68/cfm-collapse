# EXP-2: Gaussian-mixture posterior, selective memorization / mode coverage.
run_name: exp2_default
seed: 0
device: auto

data:
  d: 2
  k: 1                  # A projects R^2 -> R^1 (info loss) => multimodal posterior
  N: 500
  sigma_obs: 0.2
  mode_scale: 2.0       # modes at (+-2, +-2)
  mode_std: 0.5
  source_std: 1.0
  A_kind: project_x0

model:
  conditional: true
  width: 128
  depth: 4
  time_embed_dim: 64
  activation: silu

train:
  max_iters: 200000
  batch_size: 256
  lr: 0.001
  interpolant_sigma: 0.0
  y_noise_h: 0.0
  checkpoints: [100, 300, 1000, 3000, 10000, 30000, 100000, 200000]

eval:
  n_eval_train: 12
  M: 1000
  n_steps: 100
  ode_method: rk4
